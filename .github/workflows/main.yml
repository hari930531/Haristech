name: Backend CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SPRINGBOOT-BACKEND_SOURCE

    steps:
      # 1. Code Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: java --version

      # 3. Build & Test
      - name: Build and Test with Maven
        run: |
          mvn clean test package

      # 4. Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      # 5. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./SPRINGBOOT-BACKEND_SOURCE
          file: ./SPRINGBOOT-BACKEND_SOURCE/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/haristech-backend:latest

      # 6. Run Container (Local Runner Test)
      - name: Run Docker Container
        run: |
          docker run -d -p 8080:8080 --name backend-app ${{ vars.DOCKER_HUB_USERNAME }}/haristech-backend:latest
          sleep 10
          docker ps
