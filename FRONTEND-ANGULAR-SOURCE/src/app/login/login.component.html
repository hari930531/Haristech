<div class="login-wrapper">
  <mat-card class="login-card">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Hari's Tech Logo" class="logo-img">
      <p class="tagline">MAKING YOUR VISION TECH-READY</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email format</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" required>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="login-btn" type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="extra-links">
        <a routerLink="/forgot-password" class="link">Forgot password?</a>
        <a routerLink="/register" class="link">Create account</a>
      </div>
    </form>
  </mat-card>
</div>
