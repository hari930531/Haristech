<div class="register-wrapper">
  <mat-card class="register-card">
    
    <!-- Logo & Branding to match Login -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Hari's Tech Logo" class="logo-img" />
      <p class="tagline">MAKING YOUR VISION TECH-READY</p>
    </div>

    <h2>Create Account</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Name Fields -->
      <div class="name-fields">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" required>
          <mat-error *ngIf="registerForm.get('firstName')?.hasError('required')">
            First name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" required>
          <mat-error *ngIf="registerForm.get('lastName')?.hasError('required')">
            Last name is required
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Email -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required>
        <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
          Invalid email format
        </mat-error>
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" required>
        <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <!-- Confirm Password -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" formControlName="confirmPassword" required>
        <mat-error *ngIf="registerForm.get('confirmPassword')?.hasError('required')">
          Confirm Password is required
        </mat-error>
      </mat-form-field>

      <!-- Submit -->
      <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Creating...' : 'Create Account' }}
      </button>

      <!-- Error -->
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <!-- Link -->
    <div class="extra-links">
      <a routerLink="/login" class="link">Already have an account? Login</a>
    </div>
  </mat-card>
</div>
