name: Backend application build and test
on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: simplybyte/simplybyte-backend:gta


jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout pannu
        uses: actions/checkout@v7
      - name: install java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: mvn build
        run: mvn clean install -DskipTests=true
      - name: mvn testing
        run: mvn test
      - name: docker image build
        run: docker build -t $DOCKER_IMAGE_NAME .
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USER_NAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: docker image push
        run: docker push $DOCKER_IMAGE_NAME
  deploy-panna-porom-guys:
    env:
      DOCKER_CONTAINER_NAME: simplybyte-backend
    needs: build-and-test-job
    runs-on: ubuntu-latest
    steps:
      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{vars.HOST_IP}}
          username: ec2-user
          key: ${{secrets.AWS_EC2_KEY}}
          port: 22
          script: |
                docker rmi ${{env.DOCKER_IMAGE_NAME}}
                docker pull ${{env.DOCKER_IMAGE_NAME}}
                docker stop ${{env.DOCKER_CONTAINER_NAME}}
                docker rm ${{env.DOCKER_CONTAINER_NAME}}
                docker run -d -p 80:8090 --name ${{env.DOCKER_CONTAINER_NAME}} ${{env.DOCKER_IMAGE_NAME}}

